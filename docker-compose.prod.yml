services:
  xray:
    image: ${XRAY_IMAGE:?XRAY_IMAGE is required}
    container_name: xray-core
    restart: always
    command: run -config /etc/xray/config.json
    environment:
      - XRAY_LOCATION_ASSET=/etc/xray
    volumes:
      - shared_config:/etc/xray
      - xray_logs:/var/log/xray
    networks:
      - panel-net
      - metrics-xray-net

  socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:?SOCKET_PROXY_IMAGE is required}
    container_name: socket-proxy
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - VERSION=1
      - PING=1
      - POST=1
      - GET=1
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EVENTS=0
      - EXEC=0
      - GRPC=0
      - IMAGES=0
      - INFO=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    networks:
      - dockersock-net

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    container_name: panel-redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - redis-net

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: panel-backend
    restart: always
    volumes:
      - shared_config:/etc/xray
      - ./db_data:/app/db
      - xray_logs:/var/log/xray
    environment:
      - XRAY_API_HOST=xray:10085
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - GRPC_DNS_RESOLVER=native
      - PYTHONUNBUFFERED=1
      - PANEL_DOMAIN=${PANEL_DOMAIN:?PANEL_DOMAIN is required}
      - SUB_DOMAIN=${SUB_DOMAIN:-}
      - PANEL_USER=${PANEL_ADMIN_USER:-admin}
      - PANEL_PASSWORD=${PANEL_ADMIN_PASSWORD:?PANEL_ADMIN_PASSWORD is required}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      - DOCKER_HOST=tcp://socket-proxy:2375
      - BACKEND_LOG_LEVEL=${BACKEND_LOG_LEVEL:-INFO}
      - METRICS_AGENT_URL=http://metrics:9100
      - EGRESS_INTERNAL_TOKEN=${EGRESS_INTERNAL_TOKEN:-}
      - EGRESS_UPLINK_IFACE=${EGRESS_UPLINK_IFACE:-eth0}
      - PANEL_ROLE=${PANEL_ROLE:-master}
    env_file:
      - .env
    command: gunicorn --bind 0.0.0.0:5000 -w 1 -k gevent --timeout 120 "app:create_app()"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      socket-proxy:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - panel-net
      - redis-net
      - dockersock-net
      - metrics-net

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: panel-frontend
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/${PANEL_SECRET_PATH}/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - PANEL_SECRET_PATH=${PANEL_SECRET_PATH:?PANEL_SECRET_PATH is required}
      - PANEL_ROLE=${PANEL_ROLE:-master}
    env_file:
      - .env
    networks:
      - panel-net

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    container_name: panel-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/routes.yaml:/etc/caddy/routes.yaml:ro
      - ./certs:/root/cert:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - PANEL_SECRET_PATH=${PANEL_SECRET_PATH:?PANEL_SECRET_PATH is required}
      - PANEL_DOMAIN=${PANEL_DOMAIN:?PANEL_DOMAIN is required}
      - PROXY_DOMAIN=${PROXY_DOMAIN:?PROXY_DOMAIN is required}
      - SUB_DOMAIN=${SUB_DOMAIN:-}
    env_file:
      - .env
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - panel-net

  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE is required}
    container_name: panel-bot
    restart: always
    environment:
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:5000/api}
      - BOT_SERVICE_TOKEN=${BOT_SERVICE_TOKEN:-}
      - BOT_LOG_LEVEL=${BOT_LOG_LEVEL:-INFO}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:-redis://redis:6379/0}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - panel-net
      - redis-net

  metrics:
    image: ${METRICS_IMAGE:?METRICS_IMAGE is required}
    container_name: panel-metrics
    restart: always
    environment:
      - XRAY_API_ADDR=xray:10085
    volumes:
      - metrics_data:/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - metrics-net
      - metrics-xray-net
    depends_on:
      xray:
        condition: service_started

  xray-egress:
    image: ${XRAY_EGRESS_IMAGE:-panel-egress:latest}
    container_name: xray-egress
    restart: always
    profiles: ["egress"]
    network_mode: "container:xray-core"
    cap_add:
      - NET_ADMIN
    environment:
      - BIND_IPS_URL=http://backend:5000/api/system/egress/bind-ips
      - EGRESS_INTERNAL_TOKEN=${EGRESS_INTERNAL_TOKEN:-}
    depends_on:
      xray:
        condition: service_started
      backend:
        condition: service_healthy

networks:
  panel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          ip_range: 172.28.0.0/25
          gateway: 172.28.0.1
  redis-net:
    driver: bridge
    internal: true
  dockersock-net:
    driver: bridge
    internal: true
  metrics-net:
    driver: bridge
    internal: true
  metrics-xray-net:
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
  shared_config:
  xray_logs:
  metrics_data:
