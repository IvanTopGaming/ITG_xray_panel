name: Release (versions.json-driven)

on:
  push:
    branches: [main]
    paths:
      - versions.json

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Detect bumps → Build → Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check [skip release] marker
        id: skip
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$COMMIT_MSG" | grep -q '\[skip release\]'; then
            echo "Skip marker found — not building."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect bumped services
        id: changes
        if: steps.skip.outputs.skip == '0'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "${BEFORE_SHA}:versions.json" 2>/dev/null; then
            git show "${BEFORE_SHA}:versions.json" > /tmp/old_versions.json
          elif git rev-parse HEAD~1 >/dev/null 2>&1 && \
               git cat-file -e "HEAD~1:versions.json" 2>/dev/null; then
            echo "No before SHA — diffing against HEAD~1"
            git show "HEAD~1:versions.json" > /tmp/old_versions.json
          else
            echo "No previous versions.json — treating all services as bumped"
            echo '{}' > /tmp/old_versions.json
          fi

          echo "--- old versions.json ---"
          cat /tmp/old_versions.json
          echo "--- new versions.json ---"
          cat versions.json

          SERVICES=$(python3 - <<'PY'
          import json
          old = json.load(open("/tmp/old_versions.json"))
          new = json.load(open("versions.json"))
          changed = [
              svc
              for svc in ("backend", "frontend", "caddy", "bot", "xray_egress")
              if new.get(svc) and new.get(svc) != old.get(svc)
          ]
          print(" ".join(changed))
          PY
          )

          echo "Bumped services: '$SERVICES'"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

      - name: Nothing to build
        if: steps.skip.outputs.skip == '0' && steps.changes.outputs.services == ''
        run: echo "No service versions changed — skipping build."

      - name: Log in to GHCR
        if: steps.skip.outputs.skip == '0' && steps.changes.outputs.services != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.skip.outputs.skip == '0' && steps.changes.outputs.services != ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        if: steps.skip.outputs.skip == '0' && steps.changes.outputs.services != ''
        env:
          BUMPED: ${{ steps.changes.outputs.services }}
        run: |
          XRAY_REF=$(python3 -c "import json; print(json.load(open('versions.json'))['xray_core_ref'])")

          for SERVICE in $BUMPED; do
            VERSION=$(python3 -c "import json,sys; print(json.load(open('versions.json'))[sys.argv[1]])" "$SERVICE")

            case $SERVICE in
              backend)
                CONTEXT="./backend"
                IMAGE="ghcr.io/ivantopgaming/panel-backend"
                BUILD_ARGS="--build-arg XRAY_CORE_REF=$XRAY_REF --build-context project=."
                ;;
              frontend)
                CONTEXT="./frontend"
                IMAGE="ghcr.io/ivantopgaming/panel-frontend"
                BUILD_ARGS="--build-context project=."
                ;;
              caddy)
                CONTEXT="./caddy"
                IMAGE="ghcr.io/ivantopgaming/panel-caddy"
                BUILD_ARGS=""
                ;;
              bot)
                CONTEXT="./tg_bot"
                IMAGE="ghcr.io/ivantopgaming/panel-bot"
                BUILD_ARGS="--build-context project=."
                ;;
              xray_egress)
                CONTEXT="./xray-egress"
                IMAGE="ghcr.io/ivantopgaming/panel-egress"
                BUILD_ARGS=""
                ;;
            esac

            echo "::group::Build $SERVICE v$VERSION"
            docker buildx build $BUILD_ARGS \
              --platform linux/amd64 \
              --tag "$IMAGE:v$VERSION" \
              --tag "$IMAGE:latest" \
              --push \
              --cache-from "type=gha,scope=$SERVICE" \
              --cache-to   "type=gha,scope=$SERVICE,mode=max" \
              "$CONTEXT"
            echo "::endgroup::"

            echo "Pushed $IMAGE:v$VERSION"
          done
