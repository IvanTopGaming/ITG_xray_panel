name: Dev Build (staging images)

on:
  push:
    branches: [dev]

jobs:
  build:
    name: Build & push staging images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all services
        env:
          SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${SHA:0:7}"
          XRAY_REF=$(python3 -c "import json; print(json.load(open('versions.json'))['xray_core_ref'])")

          for SERVICE in master worker sub bot_api frontend_admin frontend_node caddy bot; do
            case $SERVICE in
              master)
                CONTEXT="./backend"
                IMAGE="ghcr.io/ivantopgaming/panel-master"
                BUILD_ARGS="--build-arg PANEL_PACKAGE=panel-master --build-context project=."
                ;;
              sub)
                CONTEXT="./backend"
                IMAGE="ghcr.io/ivantopgaming/panel-sub"
                BUILD_ARGS="--build-arg PANEL_PACKAGE=panel-sub --build-context project=."
                ;;
              bot_api)
                CONTEXT="./backend"
                IMAGE="ghcr.io/ivantopgaming/panel-bot-api"
                BUILD_ARGS="--build-arg PANEL_PACKAGE=panel-botapi --build-context project=."
                ;;
              worker)
                CONTEXT="./backend"
                IMAGE="ghcr.io/ivantopgaming/panel-worker"
                BUILD_ARGS="--build-arg XRAY_CORE_REF=$XRAY_REF --build-context project=. -f backend/Dockerfile.worker"
                ;;
              frontend_admin)
                CONTEXT="./frontend"
                IMAGE="ghcr.io/ivantopgaming/panel-frontend-admin"
                BUILD_ARGS="--build-arg UI_PACKAGE=admin --build-context project=."
                ;;
              frontend_node)
                CONTEXT="./frontend"
                IMAGE="ghcr.io/ivantopgaming/panel-frontend-node"
                BUILD_ARGS="--build-arg UI_PACKAGE=node --build-context project=."
                ;;
              caddy)
                CONTEXT="./caddy"
                IMAGE="ghcr.io/ivantopgaming/panel-caddy"
                BUILD_ARGS=""
                ;;
              bot)
                CONTEXT="./tg_bot"
                IMAGE="ghcr.io/ivantopgaming/panel-bot"
                BUILD_ARGS="--build-context project=."
                ;;
              *)
                echo "Unknown service '$SERVICE' — no build case defined for it" >&2
                exit 1
                ;;
            esac

            echo "::group::Build $SERVICE (dev-$SHORT_SHA)"
            docker buildx build $BUILD_ARGS \
              --platform linux/amd64 \
              --tag "$IMAGE:dev-$SHORT_SHA" \
              --tag "$IMAGE:dev-latest" \
              --push \
              --cache-from "type=gha,scope=$SERVICE-dev" \
              --cache-to   "type=gha,scope=$SERVICE-dev,mode=max" \
              "$CONTEXT"
            echo "::endgroup::"

            echo "Pushed $IMAGE:dev-$SHORT_SHA and $IMAGE:dev-latest"
          done
