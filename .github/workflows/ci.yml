name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, tg_bot]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Lint — ${{ matrix.service }}
        run: uvx ruff check ${{ matrix.service }}/

      - name: Format check — ${{ matrix.service }}
        run: uvx ruff format --check ${{ matrix.service }}/

  frontend-lint:
    name: Frontend (eslint + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  dockerfile-lint:
    name: Dockerfiles (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile*
          recursive: true
          ignore: DL3008,DL3013,DL3015,DL3018,DL3003,SC2046,DL3022

  shell-lint:
    name: Shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scripts/install.sh is what a deployer pipes into bash, as root, on a machine that then
      # generates every secret and issues the data tier's CA. It had no static analysis at all.
      # The file list comes from git rather than a fixed set, so a new script cannot be added
      # without being covered.
      - name: Shellcheck every tracked script
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          printf '  %s\n' "${scripts[@]}"
          shellcheck --severity=warning "${scripts[@]}"

  caddygen:
    name: caddygen (go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: caddy/caddygen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: caddy/caddygen/go.sum

      - name: Vet
        run: go vet ./...

      # -count=1 is required, not tidiness: these tests read docker-compose.*.yml and
      # caddy/routes.yaml from outside the Go module, and the build cache does not track those --
      # a plain `go test` can print a stale `ok (cached)` for a config that no longer generates.
      - name: Test
        run: go test -count=1 ./...

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: paneltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: test
      PANEL_DOMAIN: localhost
      PANEL_ADMIN_USER: admin
      PANEL_ADMIN_PASSWORD: admin
      PROXY_DOMAIN: localhost
      PANEL_SECRET_PATH: /test
      RATELIMIT_STORAGE_URI: memory://
      DATABASE_URL_TEST: postgresql+psycopg2://postgres:pw@localhost:5432/paneltest
    steps:
      - uses: actions/checkout@v4

      # The off-site backup pass is a shell script driving the real rclone binary against a `local`
      # remote, and its success mark is a psql upsert into the shared Postgres. Both tests skip when
      # the binary is missing, so without this step they are silently skipped in CI -- which is what
      # a passing summary line looks like when nothing ran. The version is read out of
      # offsite/Dockerfile so CI can never drift from what panel-offsite actually ships.
      - name: Install rclone and the Postgres client
        run: |
          RCLONE_VERSION="$(grep -m1 -oE 'rclone/rclone:[0-9.]+' ../offsite/Dockerfile | cut -d: -f2)"
          curl -fsSL "https://downloads.rclone.org/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.zip" -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp/rclone-unpack
          sudo install -m 755 "/tmp/rclone-unpack/rclone-v${RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rm -rf /tmp/rclone.zip /tmp/rclone-unpack
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -q

  bot-tests:
    name: Bot pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tg_bot
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest tests/ -q
