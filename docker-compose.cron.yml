services:
  cron:
    image: ${CRON_IMAGE:?CRON_IMAGE is required}
    container_name: panel-cron
    restart: always
    environment:
      - PANEL_ROLE=cron
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - SHARED_REDIS_URI=${SHARED_REDIS_URI:?SHARED_REDIS_URI is required}
      - BACKEND_LOG_LEVEL=${BACKEND_LOG_LEVEL:-INFO}
      - BACKEND_SLOW_SQL_MS=${BACKEND_SLOW_SQL_MS:-200}
    command: gunicorn --bind 0.0.0.0:5000 -w 1 -k gevent --timeout 120 "panel_core.roles.cron:create_app()"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cron-net

networks:
  cron-net:
    driver: bridge
