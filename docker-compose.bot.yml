services:
  bot-api:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: panel-bot-api
    restart: always
    environment:
      - PANEL_ROLE=bot
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - PANEL_DOMAIN=${PANEL_DOMAIN:?PANEL_DOMAIN is required}
      - PROXY_DOMAIN=${PROXY_DOMAIN:-}
      - PANEL_SECRET_PATH=${PANEL_SECRET_PATH:?PANEL_SECRET_PATH is required}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:?RATELIMIT_STORAGE_URI is required}
      - ADMIN_BACKEND_URL=${ADMIN_BACKEND_URL:?ADMIN_BACKEND_URL is required}
      - BACKEND_LOG_LEVEL=${BACKEND_LOG_LEVEL:-INFO}
    env_file:
      - .env
    command: gunicorn --bind 0.0.0.0:5000 -w 1 -k gevent --timeout 120 "panel_core.roles.botapi:create_app()"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - bot-net

  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE is required}
    container_name: panel-bot
    restart: always
    environment:
      - BACKEND_API_URL=http://bot-api:5000/api
      - BOT_SERVICE_TOKEN=${BOT_SERVICE_TOKEN:-}
      - BOT_LOG_LEVEL=${BOT_LOG_LEVEL:-INFO}
      - RATELIMIT_STORAGE_URI=${RATELIMIT_STORAGE_URI:?RATELIMIT_STORAGE_URI is required}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      bot-api:
        condition: service_healthy
    networks:
      - bot-net

networks:
  bot-net:
    driver: bridge
