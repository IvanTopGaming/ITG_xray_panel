# docker-compose.postgres.yml
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/certs/server.crt"
      - "-c"
      - "ssl_key_file=/certs/server.key"
      - "-c"
      - "password_encryption=scram-sha-256"
    # POSTGRES_BIND defaults to loopback on purpose: an unset value must not publish the
    # data tier to the internet. Set it to this VM's private-network address in .env.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./pg_certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    environment:
      REDIS_PANEL_PASSWORD: ${REDIS_PANEL_PASSWORD:?REDIS_PANEL_PASSWORD is required}
      REDIS_NODE_PASSWORD: ${REDIS_NODE_PASSWORD:?REDIS_NODE_PASSWORD is required}
    # REDIS_BIND defaults to loopback on purpose. This Redis runs WITHOUT TLS, so the ACL
    # password and the bot:events payload (telegram_id, e-mail) cross the wire in clear —
    # it must never be reachable from the public internet. Set it to this VM's
    # private-network address in .env, or run the bus over rediss://.
    ports:
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    entrypoint:
      - "sh"
      - "-c"
      - >
        printf 'user default off\nuser panel on >%s ~* &* +@all -@dangerous\nuser node on >%s -@all +publish +select &bot:events\n'
        "$$REDIS_PANEL_PASSWORD" "$$REDIS_NODE_PASSWORD" > /tmp/users.acl &&
        exec redis-server --aclfile /tmp/users.acl --save "" --appendonly no
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --user panel --pass \"$$REDIS_PANEL_PASSWORD\" --no-auth-warning -h 127.0.0.1 -p 6379 ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pg-backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
    volumes:
      - ./pg_backups:/backups
      - ./scripts/pg_backup.sh:/usr/local/bin/pg_backup.sh:ro
    entrypoint:
      - "bash"
      - "-c"
      - "while true; do /usr/local/bin/pg_backup.sh || true; sleep 21600; done"
