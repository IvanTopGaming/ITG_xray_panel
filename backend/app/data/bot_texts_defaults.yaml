# Checkout
checkout.button.pay:
  ru: "💳 Оплатить {price} ₽"
  en: "💳 Pay {price} ₽"

# Trial
trial.button.activate:
  ru: "🎁 Активировать пробный период ({days} дн.)"
  en: "🎁 Activate free trial ({days} days)"
trial.success:
  ru: "🎉 <b>Готово!</b>\nБесплатный доступ активирован и работает до {expires_at}."
  en: "🎉 <b>All set!</b>\nFree access activated until {expires_at}."
trial.already_used:
  ru: "ℹ️ Ты уже использовал свой пробный период. Выбери тариф, чтобы продолжить пользоваться сервисом."
  en: "ℹ️ You've already used your free trial. Please pick a plan to continue."

# Notifications
notification.expiry_3d:
  ru: "⏳ <b>Внимание!</b>\nДо конца подписки осталось всего 3 дня. Продли её заранее, чтобы всегда оставаться на связи."
  en: "⏳ <b>Heads up!</b>\nYour subscription expires in 3 days. Renew now to stay connected."
notification.expiry_1d:
  ru: "⚠️ <b>Подписка истекает!</b>\nДоступ закончится уже завтра. Самое время продлить."
  en: "⚠️ <b>Subscription expiring!</b>\nYour access ends tomorrow. It's time to renew."
notification.expiry_1h:
  ru: "⚠️ <b>Подписка истекает через час!</b>\nУспей продлить, чтобы не потерять доступ к сети."
  en: "⚠️ <b>Subscription expires in 1 hour!</b>\nRenew now to avoid losing connection."
notification.expired:
  ru: "⛔ <b>Подписка закончилась.</b>\nДоступ временно приостановлен. Продли подписку, чтобы снова быть онлайн."
  en: "⛔ <b>Subscription ended.</b>\nAccess is paused. Renew your subscription to get back online."
notification.traffic_80:
  ru: "📊 <b>Использовано 80% трафика</b>\nОсталось {remaining} из {limit}. Самое время задуматься о продлении."
  en: "📊 <b>80% of your traffic used</b>\n{remaining} left out of {limit}. Time to think about renewing."
notification.traffic_95:
  ru: "⚠️ <b>Трафик почти закончился</b>\nИспользовано {used} из {limit} — осталось всего {remaining}. Продли тариф, чтобы доступ не отключился."
  en: "⚠️ <b>Traffic almost gone</b>\nUsed {used} of {limit} — only {remaining} left. Renew your plan to keep your access."
notification.traffic_exhausted:
  ru: "⛔ <b>Трафик исчерпан</b>\nИспользовано {used} из {limit}. Доступ временно приостановлен — продли подписку, чтобы снова быть онлайн."
  en: "⛔ <b>Traffic exhausted</b>\nUsed {used} of {limit}. Access is paused — renew your subscription to get back online."
notification.payment_succeeded:
  ru: "🎉 <b>Оплата прошла успешно!</b>\nДоступ открыт до {expires}."
  en: "🎉 <b>Payment successful!</b>\nAccess is active until {expires}."
notification.payment_cancelled:
  ru: "ℹ️ Платёж отменён. Ждём тебя в разделе «Тарифы»!"
  en: "ℹ️ Payment cancelled. See you in the «Tariffs» section!"
notification.payment_failed:
  ru: "⚠️ <b>Ошибка платежа!</b>\nНе получилось провести оплату. Попробуй ещё раз."
  en: "⚠️ <b>Payment error!</b>\nWe couldn't process your payment. Please try again."
notification.access_renewed:
  ru: "🔓 <b>Доступ продлён!</b>\nСпасибо, что остаёшься с нами."
  en: "🔓 <b>Access renewed!</b>\nThanks for staying with us."
notification.access_paused:
  ru: "ℹ️ Автоматическое продление тарифа <b>{tariff_name}</b> остановлено. Текущий доступ работает до его истечения. Свяжись с поддержкой для продления вручную."
  en: "ℹ️ Auto-renewal of <b>{tariff_name}</b> has been paused. Your current access stays active until expiry. Contact support to renew manually."
notification.access_granted:
  ru: "🎁 Администратор выдал тебе <b>пожизненный доступ</b> к <b>{tariff_name}</b>!\nПодписка активна до {expires} и продлевается автоматически.\n👇 Жми «Моя подписка», чтобы получить ключи."
  en: "🎁 Admin granted you <b>lifetime access</b> to <b>{tariff_name}</b>!\nSubscription active until {expires} and renews automatically.\n👇 Tap «My subscription» to get your keys."
notification.access_granted_once:
  ru: "🎁 Администратор подарил тебе доступ к <b>{tariff_name}</b> до {expires}!\n👇 Жми «Моя подписка», чтобы забрать ключи."
  en: "🎁 Admin gifted you access to <b>{tariff_name}</b> until {expires}!\n👇 Tap «My subscription» to get your keys."
notification.access_offered:
  ru: "🎁 Администратор открыл для тебя персональный доступ к тарифу <b>{tariff_name}</b>.\nЗайди в «Тарифы», чтобы подключиться."
  en: "🎁 Admin granted you personal access to <b>{tariff_name}</b>.\nOpen «Tariffs» to subscribe."

# Help
help.body:
  ru: "ℹ️ <b>Как подключиться?</b>\n\n1️⃣ Установи <b>Happ</b> (Android) или <b>V2Box</b> (iOS).\n2️⃣ Перейди в раздел «🔐 Моя подписка».\n3️⃣ Скопируй все ключи.\n4️⃣ Импортируй их из буфера обмена в приложении.\n\n💬 Если что-то не получается — смело пиши в поддержку!"
  en: "ℹ️ <b>How to connect?</b>\n\n1️⃣ Install <b>Happ</b> (Android) or <b>V2Box</b> (iOS).\n2️⃣ Go to '🔐 My subscription'.\n3️⃣ Copy all keys.\n4️⃣ Import them from clipboard in the app.\n\n💬 If you face any issues — feel free to contact support!"

# Errors
errors.checkout_unavailable:
