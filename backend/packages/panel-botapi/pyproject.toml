[project]
name = "panel-botapi"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["panel-core", "yookassa>=3.0,<4.0"]

[tool.uv.sources]
panel-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panel_core"]
