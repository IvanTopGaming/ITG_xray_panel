[project]
name = "panel-sub"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["panel-core", "panel-links"]

[tool.uv.sources]
panel-core = { workspace = true }
panel-links = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panel_core"]
