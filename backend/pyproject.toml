[project]
name = "itg-xray-panel-backend"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "panel-core",
    "panel-adminapi",
    "panel-worker",
    "panel-master",
    "panel-sub",
    "panel-botapi",
    "panel-cron",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
panel-core = { workspace = true }
panel-adminapi = { workspace = true }
panel-worker = { workspace = true }
panel-master = { workspace = true }
panel-sub = { workspace = true }
panel-botapi = { workspace = true }
panel-cron = { workspace = true }

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==8.3.3", "pytest-flask==1.3.0"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",
    "E402",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
