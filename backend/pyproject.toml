[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes (real bugs like unused imports)
# Intentionally NOT including: I (isort), B (bugbear), UP (pyupgrade) —
# these require mass refactoring of existing code.
select = ["E", "F"]
ignore = [
    "E501",  # line too long — not enforced
    "E402",  # module-level import not at top — intentional (gevent patch_all first)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
