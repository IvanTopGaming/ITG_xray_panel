[project]
name = "itg-xray-panel-backend"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "flask",
    "flask-cors",
    "docker",
    "grpcio==1.66.2",
    "grpcio-tools==1.66.2",
    "protobuf==5.28.3",
    "psutil",
    "pyjwt",
    "gunicorn",
    "gevent",
    "flask-limiter",
    "redis",
    "flask-sqlalchemy",
    "flask-migrate",
    "flask-apscheduler",
    "filelock",
    "requests",
    "pyyaml",
    "cryptography",
    "yookassa>=3.0,<4.0",
]

[dependency-groups]
dev = ["pytest==8.3.3", "pytest-flask==1.3.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line too long — not enforced
    "E402",  # module-level import not at top — intentional (gevent patch_all first)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
