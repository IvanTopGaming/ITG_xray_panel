[project]
name = "itg-xray-panel-bot"
version = "0"
requires-python = "==3.12.*"
dependencies = [
    "aiogram>=3.0.0",
    "aiohttp",
    "aiohttp-socks",
    "python-dotenv",
    "qrcode",
    "pillow",
    "apscheduler",
    "httpx==0.27.2",
    "redis>=4.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==8.3.3", "pytest-asyncio==0.24.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line too long
    "E402",  # module-level import not at top
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
