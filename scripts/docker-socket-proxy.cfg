global
    log stdout format raw local0
    maxconn 128

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend docker
    bind :2375
    http-request allow if { method GET HEAD } { path -m reg ^(/v[0-9.]+)?/(_ping|version)$ }
    http-request allow if { method GET } { path -m reg ^(/v[0-9.]+)?/containers/(xray-core|xray-egress)/(json|logs)$ }
    http-request allow if { method POST } { path -m reg ^(/v[0-9.]+)?/containers/(xray-core|xray-egress)/restart$ }
    http-request deny
    default_backend daemon

backend daemon
    server socket /var/run/docker.sock
