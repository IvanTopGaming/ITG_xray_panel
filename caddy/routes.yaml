sni_routes:
  - name: proxy
    match: "${CADDY_PROXY_DOMAIN}"
    upstream: "${CADDY_PROXY_UPSTREAM}"

  - name: panel
    match: "${CADDY_PANEL_DOMAIN}"
    upstream: "${CADDY_PANEL_UPSTREAM}"
    tls: true
    api_path: "/${CADDY_PANEL_SECRET_PATH}/api/"
    api_upstream: "${CADDY_PANEL_API_UPSTREAM}"

  - name: sub
    match: "${CADDY_SUB_DOMAIN}"
    upstream: "${CADDY_SUB_UPSTREAM}"
    tls: true
    only_paths:
      - "/api/sub/"

  - name: bot
    match: "${CADDY_BOT_DOMAIN}"
    upstream: "${CADDY_BOT_UPSTREAM}"
    tls: true
    strip_prefix: "/${CADDY_BOT_WEBHOOK_PATH}"
    only_paths:
      - "/${CADDY_BOT_WEBHOOK_PATH}/api/billing/yookassa/webhook"
