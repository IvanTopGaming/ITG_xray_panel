sni_routes:
  - name: proxy
    match: "${PROXY_DOMAIN}"
    upstream: "xray:443"

  - name: panel
    match: "${PANEL_DOMAIN}"
    upstream: "frontend:80"
    tls: true
    api_path: "/${PANEL_SECRET_PATH}/api/"
    api_upstream: "backend:5000"

  - name: sub
    match: "${SUB_DOMAIN}"
    upstream: "backend:5000"
    tls: true
    only_paths:
      - "/api/sub/"

  - name: bot
    match: "${BOT_DOMAIN}"
    upstream: "backend:5000"
    tls: true
    strip_prefix: "/${BOT_WEBHOOK_PATH}"
    only_paths:
      - "/${BOT_WEBHOOK_PATH}/api/billing/yookassa/webhook"
